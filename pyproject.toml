[project]
name = "image-design"
version = "0.1.0"
description = "Image creation and editing workspace"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2,<0.163.0",
    "jsonschema>=4.26.0,<5.0.0",
    "mcp>=2.3.0,<3.0.0",
    "pillow>=13.0.0,<14.0.0",
    "pydantic>=2.14,<3.0",
    "pyyaml>=6.0.3,<7.0.0",
    "resvg-py>=0.5.0,<0.6.0",
    "typer>=0.27.3,<0.28.0",
    "uvicorn>=0.54.0,<0.55.0",
]

[project.urls]
Repository = "https://github.com/DavidKoleczek/image-design-smart-tool"

[project.scripts]
image-design = "image_design.cli:main"

[project.optional-dependencies]
codex = ["openai-codex>=0.163.0,<1.0.0"]
claude = ["claude-agent-sdk>=0.2.177,<0.3.0"]
openai = [
    "keyring>=25.7.0,<26.0.0",
    "openai>=3.46.0,<4.0.0",
]
all = ["image-design[codex,claude,openai]"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "image_design"

[tool.uv]
add-bounds = "major"
default-groups = "all"
exclude-newer = "5 days"

[dependency-groups]
# Every agent provider, so `uv run` type checks and tests each implementation without asking for extras.
dev = [
    "image-design[all]",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-xdist>=3.8",
    "ruff>=0.17",
    "ty>=0.0.92",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["reference", "app"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "RUF", # ruff
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie
    "PT",  # flake-pytest-style
    "PTH", # flake8-use-pathlib
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501", # line-too-long (formatter makes best-effort attempt)
    # The following rules conflict with the formatter, see: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "ISC002", # multi-line-implicit-string-concatenation
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.src]
exclude = ["reference"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The tests import their helpers, such as fakes.py, by name, and importlib mode leaves tests/ off the path otherwise.
pythonpath = ["tests"]
# In parallel. More workers than the most here are no faster, since each takes a while to start.
# A slow test gets a marker registered here, and that marker goes in `-m "not (...)"`, so it runs only when named.
addopts = '--import-mode=importlib -n auto --maxprocesses 8 -m "not (mcp_process or detached or uv)"'
markers = [
    "mcp_process: starts `image-design mcp` as a process. Run after changing adapters/mcp.py, the mcp command in cli.py, or open_app and what a client sees in capabilities/app/.",
    "detached: starts a run in a process of its own. Run after changing shared/images/detach.py, DetachedRun in shared/images/runs.py, a capability's background.py, cancel_image, or delete_image.",
    "uv: runs a drawing's image.py with uv. Run after changing capabilities/svg_image/build.py.",
]
